{% set variant = nav_variant|default('solid') %}
<header class="nav {% if variant == 'hero' %}on-hero{% else %}is-solid{% endif %}" id="siteNav">
  <div class="nav-side left">
    <button class="icon-btn nav-menu-btn" type="button" id="navMenuBtn"
            aria-label="Menu" aria-expanded="false" aria-controls="navDrawer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M4 7h16M4 12h16M4 17h16"/>
      </svg>
    </button>
    <a href="/" class="nav-link">Shop</a>
    <a href="/categories" class="nav-link">Categories</a>
    <a href="/collections" class="nav-link">Collections</a>
    <a href="/sale" class="nav-link">Sale</a>
    <a href="/about" class="nav-link">About</a>
  </div>
  <a href="/" class="nav-logo">
    <img src="/static/img/logo/{% if variant == 'hero' %}logo-light-one.png{% else %}logo-dark-one.png{% endif %}" alt="N Designs" id="navLogo">
  </a>
  <div class="nav-side right">
    <button class="icon-btn" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </button>
    <a class="icon-btn" href="{{ '/account' if current_customer else '/login' }}"
       aria-label="{{ 'Account' if current_customer else 'Login' }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.6-4 5-6 8-6s6.4 2 8 6"/></svg>
    </a>
    <a class="icon-btn cart-btn" href="/cart" id="navCart" aria-label="Bag">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>
      <span class="cart-badge" id="cartBadge" {% if not cart_count %}hidden{% endif %}>{{ cart_count }}</span>
    </a>
  </div>
</header>

<div class="nav-drawer-overlay" id="navDrawerOverlay" hidden></div>
<aside class="nav-drawer" id="navDrawer" aria-hidden="true">
  <div class="nav-drawer-head">
    <img src="/static/img/logo/logo-dark-one.png" alt="N Designs">
    <button class="icon-btn" type="button" id="navDrawerClose" aria-label="Close menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
  </div>
  <nav class="nav-drawer-links">
    <a href="/">Shop</a>
    <a href="/categories">Categories</a>
    <a href="/collections">Collections</a>
    <a href="/sale">Sale</a>
    <a href="/about">About</a>
    {% if current_customer %}
    <a href="/account">Account</a>
    {% else %}
    <a href="/login">Login</a>
    <a href="/register">Register</a>
    {% endif %}
  </nav>
</aside>
