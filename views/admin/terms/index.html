{% extends "admin/base.html" %}

{% block title %}By N Designs — Terms{% endblock %}

{% block extra_css %}
  <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">
{% endblock %}

{% block content %}
  <div class="page-breadcrumb d-none d-sm-flex align-items-center mb-3">
    <div class="breadcrumb-title pe-3">By N Designs</div>
    <div class="ps-3">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0 p-0">
          <li class="breadcrumb-item"><a href="/admin/dashboard"><i class="material-icons-outlined">home</i></a></li>
          <li class="breadcrumb-item active" aria-current="page">Terms</li>
        </ol>
      </nav>
    </div>
  </div>

  <form id="terms-form" method="post" action="/admin/Terms">
    <div class="card rounded-4 mb-3">
      <div class="card-body p-4">
        <h4 class="fw-bold mb-4">Terms</h4>
        <div class="mb-3">
          <label class="form-label" for="title">Title</label>
          <input class="form-control" type="text" id="title" name="title" maxlength="255"
                 value="{{ page.title if page and page.title else '' }}">
        </div>
        <div class="mb-0">
          <label class="form-label" for="body-editor">Body</label>
          <textarea class="d-none" id="body" name="body">{{ editor_html }}</textarea>
          <div id="body-editor"></div>
        </div>
      </div>
    </div>

    <div class="d-flex gap-2 mb-4">
      <button type="submit" class="btn btn-admin-primary">Save changes</button>
    </div>
  </form>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
<script>
(function () {
  var textarea = document.getElementById('body');
  var form = document.getElementById('terms-form');
  if (!textarea || !form) return;

  var quill = new Quill('#body-editor', {
    theme: 'snow',
    modules: {
      toolbar: [
        [{ header: [2, 3, false] }],
        ['bold', 'italic', 'underline'],
        [{ list: 'ordered' }, { list: 'bullet' }],
        ['link'],
        ['clean']
      ]
    }
  });
  if (textarea.value) quill.clipboard.dangerouslyPasteHTML(textarea.value);

  form.addEventListener('submit', function () {
    textarea.value = quill.root.innerHTML;
  });
})();
</script>
{% endblock %}
