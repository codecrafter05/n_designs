<div id="adminConfirm" class="admin-confirm-overlay" hidden>
  <div class="admin-confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="adminConfirmTitle">
    <h3 class="admin-confirm-title" id="adminConfirmTitle">Please confirm</h3>
    <p class="admin-confirm-message" id="adminConfirmMessage"></p>
    <div class="admin-confirm-actions">
      <button type="button" class="btn btn-admin-secondary" data-confirm-cancel>Cancel</button>
      <button type="button" class="btn btn-admin-danger" data-confirm-ok>Confirm</button>
    </div>
  </div>
</div>
